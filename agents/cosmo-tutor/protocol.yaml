triggers:
  user-message:
    input:
      USER_MESSAGE: { type: string }

agent:
  model: openai/gpt-4o
  system: system
  temperature: 0.7

handlers:
  user-message:
    Add user message:
      block: add-message
      role: user
      prompt: user-message
      input: [USER_MESSAGE]
      display: hidden

    Respond:
      block: next-message
