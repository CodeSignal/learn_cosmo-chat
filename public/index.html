<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatCPT – Cosmo's Prompt Tutor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Design System: Foundations -->
  <link rel="stylesheet" href="/design-system/colors/colors.css" />
  <link rel="stylesheet" href="/design-system/spacing/spacing.css" />
  <link rel="stylesheet" href="/design-system/typography/typography.css" />

  <!-- Design System: Components -->
  <link rel="stylesheet" href="/design-system/components/button/button.css" />
  <link rel="stylesheet" href="/design-system/components/boxes/boxes.css" />
  <link rel="stylesheet" href="/design-system/components/icons/icons.css" />
  <link rel="stylesheet" href="/design-system/components/input/input.css" />
  <link rel="stylesheet" href="/design-system/components/tags/tags.css" />
  <link rel="stylesheet" href="/design-system/components/dropdown/dropdown.css" />
  <link rel="stylesheet" href="/design-system/components/modal/modal.css" />
  <link rel="stylesheet" href="/design-system/components/numeric-slider/numeric-slider.css" />

  <!-- highlight.js: always-dark theme for code blocks -->
  <link rel="stylesheet" href="/hljs-github-dark.css" />

  <link rel="stylesheet" href="/app.css" />
</head>
<body>

  <div class="boot-error body-small" id="bootError" role="alert" hidden></div>

  <div class="chat-app" style="visibility:hidden">

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar__header">
        <div class="sidebar__header-brand">
          <span class="cosmo-avatar medium" aria-hidden="true"></span>
          <span class="body-xxsmall sidebar__title">ChatCPT</span>
        </div>
      </div>

      <nav class="sidebar__nav" aria-label="Workspace">
        <button type="button" class="sidebar__nav-item" id="newChatBtn">
          <svg class="sidebar__nav-ico sidebar__nav-ico--svg" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true">
            <use href="/Images/message-plus-square.svg#message-plus-square" xlink:href="/Images/message-plus-square.svg#message-plus-square"/>
          </svg>
          <span class="sidebar__nav-label">New chat</span>
        </button>
        <button type="button" class="sidebar__nav-item" id="settingsBtn" aria-label="Open settings" style="display:none">
          <svg class="sidebar__nav-ico sidebar__nav-ico--svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span class="sidebar__nav-label">Settings</span>
        </button>
      </nav>

      <h2 class="sidebar__history-heading" id="historyHeading" style="display:none">History</h2>
      <nav class="sidebar__sessions" id="sessionList" aria-label="Conversations" style="display:none"></nav>
      <div class="sidebar__spacer" id="sidebarSpacer" style="display:none"></div>

      <div class="sidebar__model">
        <div id="modelSelect"></div>
        <span class="body-xsmall sidebar__model-static" id="modelStatic" hidden></span>
      </div>

      <!-- A23: keep the separator inside the complementary landmark. -->
      <div class="sidebar-resizer" id="sidebarResizer" role="separator"
           aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>

    </aside>

    <!-- ── MAIN CHAT AREA ── -->
    <div class="chat-main">

      <!-- Persistent status live region (A1/A11). Outside the message list so
           re-renders never recreate it; only short deliberate strings go here. -->
      <div id="chatStatus" class="visually-hidden" role="status"></div>

      <!-- Chat history -->
      <main class="chat-history" id="chatHistory">
        <!-- A10: persistent conversation title. Empty-state copy is not a heading. -->
        <h1 id="conversationHeading" class="visually-hidden">New conversation</h1>
        <div class="empty-state" id="emptyState">
          <span class="cosmo-avatar large" aria-hidden="true"></span>
          <p class="heading-small empty-state__heading">What's on your mind?</p>
        </div>
      </main>

      <!-- Composer -->
      <footer class="composer-wrap">
        <div class="chatbox" id="composer">
          <div class="cosmo-ai-glow" aria-hidden="true"></div>
          <div class="cosmo-ai-ring" aria-hidden="true"></div>

          <div class="composer__input-wrap composer_input-wrap">
            <div class="composer__attachment composer_attachment" id="attachmentPreview" hidden></div>
            <textarea
              class="input composer__textarea composer_textarea"
              id="promptInput"
              placeholder="Ask me anything..."
              rows="1"
              aria-label="Prompt input"
            ></textarea>
            <!-- Explains transient readOnly while streaming (A3); wired via aria-describedby. -->
            <p id="promptInputBusyHint" class="visually-hidden"></p>
          </div>

          <!-- A13: role="group" (not toolbar) — buttons stay ordinary Tab stops; no roving tabindex. -->
          <div class="composer__toolbar composer_toolarea" role="group" aria-label="Composer actions">
            <div class="composer__attach-icons" id="attachIcons" style="display:none">
              <button type="button" class="composer__icon-btn" id="uploadImageBtn" aria-label="Attach an image" title="Attach an image">
                <svg class="composer__toolbar-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true">
                  <use href="/Images/AttachmentImage.svg#attachment-image" xlink:href="/Images/AttachmentImage.svg#attachment-image"/>
                </svg>
              </button>
              <button type="button" class="composer__icon-btn" id="uploadFileBtn" aria-label="Attach a file" title="Attach a file">
                <svg class="composer__toolbar-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true">
                  <use href="/Images/AttachmentFile.svg#attachment-file" xlink:href="/Images/AttachmentFile.svg#attachment-file"/>
                </svg>
              </button>
            </div>
            <button type="button" class="composer__send-btn" id="sendBtn" aria-label="Send prompt" disabled>
              <svg class="composer__toolbar-svg composer__send-svg" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true">
                <use href="/Images/SendIcon.svg#send-icon" xlink:href="/Images/SendIcon.svg#send-icon"/>
              </svg>
              <svg class="composer__toolbar-svg composer__stop-svg" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true" style="display:none">
                <rect x="4" y="4" width="10" height="10" rx="2"/>
              </svg>
            </button>
          </div>

        </div>
        <p class="body-xxsmall composer__hint">Cosmo can make mistakes. Practice refining your prompts.</p>
      </footer>

    </div><!-- /.chat-main -->

  </div><!-- /.chat-app -->

  <input type="file" id="fileInput" accept=".pdf,.txt,.doc,.docx,.png,.jpg,.jpeg,.gif,.webp" multiple style="display:none" aria-hidden="true" />

  <script type="module" src="/app.bundle.js"></script>
</body>
</html>
