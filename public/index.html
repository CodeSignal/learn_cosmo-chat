<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatCPT – Cosmo's Prompt Tutor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/design-system/colors/colors.css" />
  <link rel="stylesheet" href="/design-system/spacing/spacing.css" />
  <link rel="stylesheet" href="/design-system/typography/typography.css" />
  <link rel="stylesheet" href="/design-system/components/icons/icons.css" />
  <link rel="stylesheet" href="/design-system/components/tags/tags.css" />

  <link rel="stylesheet" href="/app.css" />
</head>
<body>

  <div class="chat-app">

    <!-- ── CHAT HISTORY (empty to start) ── -->
    <main class="chat-history" id="chatHistory" role="log" aria-live="polite">

      <!-- Empty state -->
      <div class="empty-state" id="emptyState">
        <span class="icon icon-cosmo-black icon-xlarge"></span>
        <h1 class="heading-small empty-state__heading">What's on your mind?</h1>
      </div>

    </main>

    <!-- ── COMPOSER ── -->
    <footer class="composer-wrap">
      <div class="composer" id="composer">

        <div class="composer__attachment" id="attachmentPreview" hidden>
          <span class="tag outline">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span id="attachmentName">file</span>
          </span>
          <button class="composer__icon-btn composer__remove-btn" id="removeAttachmentBtn" aria-label="Remove attachment">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <textarea
          class="composer__input"
          id="promptInput"
          placeholder="Ask anything"
          rows="1"
          aria-label="Prompt input"
        ></textarea>

        <div class="composer__toolbar">
          <button class="composer__icon-btn" id="uploadBtn" aria-label="Attach a file" title="Attach a file">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>

          <button class="composer__send-btn" id="sendBtn" aria-label="Send prompt" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>

      </div>
      <p class="composer__hint body-xsmall">Cosmo can make mistakes. Practice refining your prompts.</p>
    </footer>

  </div>

  <input type="file" id="fileInput" accept=".pdf,.txt,.doc,.docx" style="display:none" aria-hidden="true" />

  <script type="module" src="/app.js"></script>
</body>
</html>
