<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatCPT – Cosmo's Prompt Tutor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Design System: Foundations -->
  <link rel="stylesheet" href="/design-system/colors/colors.css" />
  <link rel="stylesheet" href="/design-system/spacing/spacing.css" />
  <link rel="stylesheet" href="/design-system/typography/typography.css" />

  <!-- Design System: Components -->
  <link rel="stylesheet" href="/design-system/components/button/button.css" />
  <link rel="stylesheet" href="/design-system/components/boxes/boxes.css" />
  <link rel="stylesheet" href="/design-system/components/icons/icons.css" />
  <link rel="stylesheet" href="/design-system/components/input/input.css" />
  <link rel="stylesheet" href="/design-system/components/tags/tags.css" />

  <!-- highlight.js: always-dark theme for code blocks -->
  <link rel="stylesheet" href="/hljs-github-dark.css" />

  <link rel="stylesheet" href="/app.css" />
</head>
<body>

  <div class="chat-app">

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar__header">
        <span class="icon icon-cosmo-black icon-small"></span>
        <span class="label-medium sidebar__title">ChatCPT</span>
      </div>

      <button class="button button-secondary button-small sidebar__new-btn" id="newChatBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New chat
      </button>

      <nav class="sidebar__sessions" id="sessionList" aria-label="Conversations"></nav>

      <div class="sidebar__model">
        <label class="body-xsmall sidebar__model-label" for="modelSelect">Model</label>
        <select class="input sidebar__model-select" id="modelSelect" aria-label="Select model"></select>
        <span class="body-xsmall sidebar__model-static" id="modelStatic" hidden></span>
      </div>

    </aside>

    <!-- ── MAIN CHAT AREA ── -->
    <div class="chat-main">

      <!-- Chat history -->
      <main class="chat-history" id="chatHistory" role="log" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <span class="icon icon-cosmo-black icon-xlarge"></span>
          <h1 class="heading-small empty-state__heading">What's on your mind?</h1>
        </div>
      </main>

      <!-- Composer -->
      <footer class="composer-wrap">
        <div class="box emphasized non-interactive composer" id="composer">

          <div class="composer__attachment" id="attachmentPreview" hidden></div>

          <textarea
            class="input composer__textarea"
            id="promptInput"
            placeholder="Ask anything"
            rows="1"
            aria-label="Prompt input"
          ></textarea>

          <div class="composer__toolbar">
            <button class="button button-tertiary button-xsmall composer__attach-btn"
                    id="uploadBtn"
                    aria-label="Attach a file"
                    title="Attach a file">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
            </button>

            <button class="button button-primary composer__send-btn"
                    id="sendBtn"
                    aria-label="Send prompt"
                    disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
              </svg>
            </button>
          </div>

        </div>
        <p class="body-xsmall composer__hint">Cosmo can make mistakes. Practice refining your prompts.</p>
      </footer>

    </div><!-- /.chat-main -->

  </div><!-- /.chat-app -->

  <input type="file" id="fileInput" accept=".pdf,.txt,.doc,.docx,.png,.jpg,.jpeg,.gif,.webp" multiple style="display:none" aria-hidden="true" />

  <script type="module" src="/app.bundle.js"></script>
</body>
</html>
